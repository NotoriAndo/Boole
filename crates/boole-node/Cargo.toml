[package]
name = "boole-node"
default-run = "boole-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# P0.7 — workspace-internal application crate. `publish = false` blocks an
# accidental `cargo publish` of in-flight code and tells cargo-deny that
# the path dependencies on sibling crates are not a wildcard violation.
publish = false

# P1.8 — `dev-mock-payment` gates the magic test-payment string
# `boole-native-test:paid` accepted by the `/verify-answer` route.
# OFF by default so a release build (`--no-default-features`) does
# not even compile the constant into the binary; tests opt in via
# `cargo test --features boole-node/dev-mock-payment`.
[features]
default = []
dev-mock-payment = []
native-shadow-closed-local-replay = []
linux-arm64-authority = ["boole-native-shadow-protocol/linux-arm64-authority"]

[[bin]]
name = "boole-native-shadow-replay-node"
path = "src/bin/boole-native-shadow-replay-node.rs"
required-features = ["native-shadow-closed-local-replay"]

[[bin]]
name = "boole-mac-native-shadow-replay-node"
path = "src/bin/boole-mac-native-shadow-replay-node.rs"
required-features = ["native-shadow-closed-local-replay"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
blake3.workspace = true
boole-core = { path = "../boole-core" }
# ADR-0019 Stage 1 (EVM-NODE-BRIDGE-QUALIFIED): the frozen verifier-only
# compressed-STARK EVM checker. Linked so the node-side bridge can be qualified
# against the consensus outcome type; NOT wired into any block-verdict path, and
# no prover (`sp1-verifier`, `default-features = false`) enters the graph.
boole-evm-adapter = { path = "../boole-evm-adapter" }
boole-lean-runner = { path = "../boole-lean-runner" }
boole-native-shadow-protocol = { path = "../boole-native-shadow-protocol" }
boole-p2p = { path = "../boole-p2p" }
clap.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true

# P0.1a — shared test helpers (rand_suffix / repo_root /
# lake_and_lean_available). dev-dependencies so the release build does not
# link the mock surface; production crates must never depend on it.
[dev-dependencies]
boole-testkit = { path = "../boole-testkit" }

# P0.6b — inherit `[workspace.lints]` so the workspace-wide deny set
# (currently `unsafe_code = "deny"`) is enforced uniformly on this crate.
[lints]
workspace = true
