[package]
name = "boole-evm-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Gate-fitness representative crate (operator msg 3459). It carries ONE
# EVM state-transition representative through a common adapter seam that
# mirrors `boole-node::UsefulProductAdapter`; it is NOT wired into the
# consensus/runtime path and makes no supply/mineable claim. publish =
# false blocks an accidental `cargo publish` and tells cargo-deny the
# sibling path deps are intentional.
publish = false

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# EVM zkVM verifier-only path (ADR-0018). Compressed-STARK verification ONLY:
# `default-features = false` keeps the `ark` (Groth16/Plonk on-chain) feature
# OFF, so no arkworks tree is pulled; and this crate depends on sp1-verifier
# ALONE — NO sp1-sdk, NO sp1-prover, NO proving-key. Exact-version pin, no git
# source. Preflight-gated: added only after the supply-chain checks are recorded.
sp1-verifier = { version = "=6.3.1", default-features = false }

# P0.6 — inherit the workspace-wide deny set (unsafe_code = "deny").
[lints]
workspace = true
