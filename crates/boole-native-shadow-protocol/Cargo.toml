[package]
name = "boole-native-shadow-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
default = []
linux-arm64-authority = []
fresh-answer-canary = ["dep:ed25519-dalek", "dep:zeroize"]

[dependencies]
base64.workspace = true
ed25519-dalek = { workspace = true, optional = true, features = ["zeroize"] }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[[bin]]
name = "boole-canary-authority"
path = "src/bin/boole-canary-authority.rs"
required-features = ["fresh-answer-canary"]
