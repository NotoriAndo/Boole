# Built as an added member of a noir workspace checkout at the compiler version being decoded, so that
# acir / acvm / noirc_abi and every locked dependency are the ones that compiler release uses.
[package]
name = "boole_acir_tool"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "boole-acir-tool"
path = "src/main.rs"

[features]
# Bn254BlackBoxSolver is a tuple struct with a `pedantic_solving` flag (v1.0.0-beta.3 .. beta.2x)
bn_bool = []
# WitnessStack is deserialized with `TryFrom<&[u8]>` (before v1.0.0-beta.6)
ws_tryfrom = []

[dependencies]
acvm.workspace = true
bn254_blackbox_solver.workspace = true
noirc_abi.workspace = true
serde_json.workspace = true
base64.workspace = true
