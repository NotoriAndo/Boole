name: native-shadow-boot-produce-arm64

# The three arm64 boot files have to be produced twice, independently, and come
# out byte for byte identical. The developer Mac cannot produce them at all --
# the tools are aarch64 ELFs and the image is ext4 -- so the two runs happen
# here, on the runner the producer authority sealed.
#
# This is asked for rather than run on every change. Each run acquires the
# frozen closure and writes a multi-gigabyte root disk, which is not something
# to do twice on every pull request. Dispatch it when the evidence is wanted.
#
# What comes out is evidence, not a release. The images are kept as workflow
# artifacts and as a SHA-256 manifest; nothing here commits them, and nothing
# here publishes them. Producing the files is also not booting them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce:
    # Two independent jobs out of one definition. The authority requires the
    # runs to be separate; a second copy of the recipe would be a second thing
    # that can drift, which is exactly what the byte comparison is looking for.
    name: produce (${{ matrix.replica }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      # Two runs are two pieces of evidence. If the first one fails, the second
      # still has something to say about why.
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          # rust-toolchain.toml asks for these; installing them up front keeps
          # rustup from fetching anything once the network is taken away.
          components: rustfmt, clippy

      - name: Require the host tools the build resolves from PATH
        # Exactly the list the driver itself checks, and nothing beyond it. The
        # driver checks it too, but by then the run has fetched 200 MB and
        # rebuilt the launcher, so all that is wanted here is to find out in
        # thirty seconds rather than twenty minutes.
        #
        # mke2fs and debugfs are deliberately absent: the image is written by
        # the copies inside the frozen tree, never by the runner's. Asking the
        # runner for them here would suggest its copies mattered.
        #
        # Nothing in this list is pinned either. The build records the digest of
        # whichever gpgv and zstd the runner has, which is the arrangement the
        # replay already uses.
        shell: bash
        run: |
          set -euo pipefail
          for tool in env gpgv mkdir mktemp mount mountpoint python3 readlink \
            rm systemd-run umount uname zstd; do
            command -v "$tool" >/dev/null || {
              printf 'the runner has no %s\n' "$tool" >&2
              exit 1
            }
          done

      - name: Acquire the frozen Rust distribution and re-prove its sealed record
        # This runs first so that what it fetches is decided by nothing except an
        # empty store, and the sealed record it must reproduce says exactly that:
        # three archives fetched, no store hits.
        #
        # The acquirer writes its result exactly once and refuses to overwrite
        # one, which on a fresh checkout is a file that is already there. So the
        # sealed record is set aside, regenerated from this runner's own fetch,
        # and required to come back byte for byte identical. A difference fails
        # the run here and is never resolved by keeping the newer one: this
        # checkout is thrown away, and the seal in the repository is untouched.
        shell: bash
        run: |
          set -euo pipefail
          sealed=native/containment/native-shadow-boot-rustdist-acquisition-result-arm64-v1.json
          rm "$sealed"
          python3 scripts/native_shadow_boot_rustdist_acquire_arm64_v1.py --acquire
          git diff --exit-code -- "$sealed"

      - name: Acquire the frozen package payloads
        # Not the acquirer that filled the developer Mac's store. That one pins
        # the Mac's gpgv and zstd, the packages its store already held, and the
        # exact request count of one run -- all true about that run, none of it
        # true here, and none of it something to loosen after the fact.
        #
        # This one reads the same sealed digests and refuses anything else. The
        # result is written to scratch rather than into the tree: which payloads
        # a host had to fetch is a fact about the host, not about the artifacts.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acquire"
          python3 scripts/native_shadow_boot_ci_payload_acquire_arm64_v1.py acquire \
            --cas "$PWD/local-docs/native-shadow-runtime-rootfs-source-lock-v1/cas" \
            --zstd "$(readlink -f "$(command -v zstd)")" \
            --result "$RUNNER_TEMP/acquire/ci-payload-acquisition.json"

      - name: Rebuild the launcher and match its sealed digest
        # The last step that is allowed to reach the network. Everything after
        # this runs with the network taken away.
        run: >-
          python3 scripts/native_shadow_launcher_emit_arm64_v1.py emit
          --out "$RUNNER_TEMP/launcher"

      - name: Produce the three boot files offline
        run: |
          set -euo pipefail
          sudo ./scripts/native-shadow-boot-produce-arm64.sh \
            --cas "$PWD/local-docs/native-shadow-runtime-rootfs-source-lock-v1/cas" \
            --launcher "$RUNNER_TEMP/launcher" \
            --outputs "$RUNNER_TEMP/boot-outputs" \
            --result "$RUNNER_TEMP/boot-outputs/PRODUCE-RESULT.json"

      - name: Write the SHA-256 manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 scripts/native_shadow_boot_image_produce_arm64_v1.py manifest \
            --repository-root . \
            --outputs "$RUNNER_TEMP/boot-outputs" \
            > "$RUNNER_TEMP/evidence/OUTPUT-MANIFEST.txt"
          cat "$RUNNER_TEMP/evidence/OUTPUT-MANIFEST.txt"

      - name: Require this replica to have proved what it did
        # The producer already stops a run whose filesystem check failed, whose
        # image carries a timestamp outside the closed set, or whose loader
        # opened a library from outside the frozen tree. This is the other case:
        # a result that never ran the check and reads like one that passed. It
        # is checked here, and again in compare, from the file a reader gets.
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/boot-outputs/PRODUCE-RESULT.json" \
            "$RUNNER_TEMP/evidence/PRODUCE-RESULT.json"
          python3 scripts/native_shadow_boot_produce_phase_arm64_v1.py evidence \
            --result "$RUNNER_TEMP/evidence/PRODUCE-RESULT.json"

      - name: Keep the manifest and the evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-manifest-${{ matrix.replica }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7

      - name: Keep the produced files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-outputs-${{ matrix.replica }}
          path: ${{ runner.temp }}/boot-outputs
          if-no-files-found: error
          retention-days: 7
          # The root disk is mostly zeroes, so even the cheapest setting shrinks
          # it a long way, and the expensive ones cost minutes for very little.
          compression-level: 1

  compare:
    # Byte identity or nothing. A difference is reported and stops the run; it
    # is never resolved by picking one of the two.
    name: compare
    needs: [produce]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Fetch the first manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boot-manifest-1
          path: first

      - name: Fetch the second manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boot-manifest-2
          path: second

      - name: Require each run to have proved what it did
        # Before the two are compared at all. Two replicas that both skipped the
        # filesystem check would agree with each other perfectly.
        run: |
          set -euo pipefail
          for replica in first second; do
            printf '== %s ==\n' "$replica"
            python3 scripts/native_shadow_boot_produce_phase_arm64_v1.py evidence \
              --result "$replica/PRODUCE-RESULT.json"
          done

      - name: Require the two independent runs to agree byte for byte
        run: |
          set -euo pipefail
          cat first/OUTPUT-MANIFEST.txt
          python3 scripts/native_shadow_boot_image_produce_arm64_v1.py compare \
            --first first/OUTPUT-MANIFEST.txt \
            --second second/OUTPUT-MANIFEST.txt
