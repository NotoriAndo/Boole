name: verdict-corpus

# SC.9c (ADR-0016 (a)/(a-1)) — cross-platform verdict corpus, a REQUIRED
# consensus gate: the three-state Lean verdict must be byte-identical on
# every (platform × profile) a node might run, because a divergent verdict
# is a fork vector. Four concrete jobs (Linux/macOS × debug/release) each
# compare the fixed corpus against the committed golden fixture; the
# always-created aggregate `verdict-corpus` job is the branch-protection
# required check.
#
# Deliberately NOT trigger-path-filtered: the required aggregate exists on
# every PR. Process/documentation-only changes keep that status but do not
# start the four expensive corpus jobs; every other change still runs them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token (mirrors ci.yml — N0-pre.2).
permissions:
  contents: read

jobs:
  change-scope:
    name: verdict-change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      process_only: ${{ steps.classify.outputs.process_only }}
    steps:
      - name: Checkout change range
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Select process-only or full validation
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push && -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != "$zero" ]]; then
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          else
            printf 'process_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames "$base" "$head" |
            python3 scripts/ci_change_scope.py --github-output "$GITHUB_OUTPUT"

  corpus:
    name: corpus (${{ matrix.os }}, ${{ matrix.profile }})
    needs: change-scope
    if: needs.change-scope.outputs.process_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A single divergent platform/profile must be visible on its own —
      # do not cancel the siblings that would show WHICH combination forked.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [debug, release]
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        # Pinned to the same immutable SHA ci.yml uses (v6.0.3).
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        # Pinned to the same immutable SHA ci.yml uses.
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build canonical checker
        shell: bash
        run: |
          set -euo pipefail
          cd lean/checker
          lake build Boole.Family.V0Helpers boole_check

      - name: Run verdict corpus (debug)
        if: matrix.profile == 'debug'
        run: cargo test -p boole-lean-runner --test verdict_corpus --locked -- --nocapture

      - name: Run verdict corpus (release)
        if: matrix.profile == 'release'
        run: cargo test -p boole-lean-runner --test verdict_corpus --locked --release -- --nocapture

  # The single status branch protection requires. `if: always()` so the
  # aggregate exists even when a matrix job fails — a required status that
  # can be silently absent protects nothing.
  verdict-corpus:
    name: verdict-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [change-scope, corpus]
    if: always()
    steps:
      - name: Require all corpus jobs green
        shell: bash
        env:
          PROCESS_ONLY: ${{ needs.change-scope.outputs.process_only }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
        run: |
          set -euo pipefail
          echo "corpus matrix result: ${CORPUS_RESULT}"
          if [[ "$PROCESS_ONLY" == true ]]; then
            test "${CORPUS_RESULT}" = "skipped"
            exit 0
          fi
          test "${CORPUS_RESULT}" = "success"
