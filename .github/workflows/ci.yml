name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual fallback so a missed push webhook (rare GitHub Actions hiccup)
  # can be re-triggered without an empty commit. `gh workflow run ci.yml
  # --ref main` will queue a fresh run on the current `main` HEAD.
  workflow_dispatch:

# N0-pre.2 (audit) — least-privilege token: every job only reads the
# repository; nothing in CI may write with the default GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  native-shadow-containment-linux:
    name: native-shadow-containment-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Prove fixed native-shadow service-account resolution
        shell: bash
        run: |
          set -euo pipefail
          for identity in boole-node boole-native-checker; do
            if getent passwd "$identity" >/dev/null || getent group "$identity" >/dev/null; then
              echo "native-shadow service identity unexpectedly pre-exists: $identity" >&2
              exit 1
            fi
          done
          sudo groupadd --system boole-node
          sudo useradd --system --gid boole-node --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin boole-node
          sudo groupadd --system boole-native-checker
          sudo useradd --system --gid boole-native-checker --home-dir /nonexistent --no-create-home --shell /bin/false boole-native-checker
          cargo test --locked -p boole-native-shadow-protocol --lib \
            service_identities::tests::real_fixed_accounts_resolve_in_named_linux_gate \
            -- --ignored --exact --nocapture

      - name: Verify tracked systemd deployment envelope
        run: sudo ./scripts/native-shadow-systemd-deployment-envelope-gate.sh

      - name: Exercise the real launcher Unix qualification session
        run: >-
          cargo test --locked -p boole-native-shadow-launcher --lib
          qualification::unix::tests::real_kernel_stream_round_trip_observes_peer_and_half_close
          -- --ignored --exact --nocapture

      - name: Verify fixed launcher root and capability shape
        run: ./scripts/native-shadow-launcher-privilege-gate.sh

      - name: Compose launcher pre-lock, lifetime lock, and instance identity
        run: ./scripts/native-shadow-launcher-prelock-gate.sh

      - name: Establish the real native-shadow manager cgroup
        run: ./scripts/native-shadow-manager-cgroup-gate.sh

      - name: Build the synthetic rootfs with network access blocked
        run: sudo ./scripts/native-shadow-rootfs-builder-linux-gate.sh

      - name: Probe delegated cgroup and namespace capabilities
        run: sudo ./scripts/native-shadow-containment-capability-probe.sh

      - name: Exercise enforced seccomp and Landlock behavior
        run: |
          set -euo pipefail
          cargo build --locked -p boole-lean-runner --bin sandbox_probe
          cargo test --locked -p boole-lean-runner --lib \
            configure_child_sandbox_enforce -- --nocapture

  native-shadow-rootfs-replay-linux:
    name: native-shadow-rootfs-replay-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Install fixed native-shadow service accounts
        shell: bash
        run: |
          set -euo pipefail
          for identity in boole-node boole-native-checker; do
            if getent passwd "$identity" >/dev/null || getent group "$identity" >/dev/null; then
              echo "native-shadow service identity unexpectedly pre-exists: $identity" >&2
              exit 1
            fi
          done
          sudo groupadd --system boole-node
          sudo useradd --system --gid boole-node --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin boole-node
          sudo groupadd --system boole-native-checker
          sudo useradd --system --gid boole-native-checker --home-dir /nonexistent --no-create-home --shell /bin/false boole-native-checker

      - name: Rebuild, independently verify, and probe the portable checker rootfs
        run: sudo ./scripts/native-shadow-portable-rootfs-replay-linux.sh

  native-shadow-rootfs-replay-linux-arm64:
    name: native-shadow-rootfs-replay-linux-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Install fixed native-shadow service accounts
        shell: bash
        run: |
          set -euo pipefail
          for identity in boole-node boole-native-checker; do
            if getent passwd "$identity" >/dev/null || getent group "$identity" >/dev/null; then
              echo "native-shadow service identity unexpectedly pre-exists: $identity" >&2
              exit 1
            fi
          done
          sudo groupadd --system boole-node
          sudo useradd --system --gid boole-node --home-dir /nonexistent --no-create-home --shell /usr/sbin/nologin boole-node
          sudo groupadd --system boole-native-checker
          sudo useradd --system --gid boole-native-checker --home-dir /nonexistent --no-create-home --shell /bin/false boole-native-checker

      - name: Rebuild and execute the Linux arm64 checker parity matrix
        run: sudo ./scripts/native-shadow-portable-rootfs-replay-linux-arm64.sh

  native-shadow-launcher-build-arm64:
    name: native-shadow-launcher-build-arm64
    # The launcher target is aarch64-unknown-linux-gnu, which the developer Mac
    # cannot produce, so the two independent builds run here instead. The
    # toolchain below is the workspace channel from rust-toolchain.toml, not the
    # rust-lang-ci nightly frozen for the guest checker -- two different
    # toolchains doing two different jobs.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          # rust-toolchain.toml asks for these, so install them up front rather
          # than let rustup fetch them from inside the notionally offline build.
          components: rustfmt, clippy

      - name: Build the arm64 launcher ELF twice and require identical bytes
        run: python3 scripts/native_shadow_launcher_build_arm64_v1.py --build

      - name: Show the launcher build result
        # The double build can only run here, so this run is where the launcher
        # digest is discovered. Printing the sealed document and its digest lets
        # the result be committed later as an exact byte-for-byte pin, which
        # every subsequent run of the step above then has to re-prove.
        run: |
          set -euo pipefail
          result=native/containment/native-shadow-launcher-build-result-arm64-v1.json
          sha256sum "$result"
          cat "$result"

  native-shadow-launcher-build-arm64-v2:
    name: native-shadow-launcher-build-arm64-v2
    # The successor is built beside, never instead of, the historical v1
    # launcher. Its frozen overlay adds the evidence producer and remaps both
    # the workspace and fresh Cargo home before the ELF can be sealed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Build the arm64 launcher v2 ELF twice and require identical bytes
        run: python3 scripts/native_shadow_launcher_build_arm64_v2.py --build

      - name: Show the launcher v2 build result
        # The first arm64 run discovers the candidate. It is printed for exact
        # review, then committed as an immutable result before this PR may merge.
        run: |
          set -euo pipefail
          result=native/containment/native-shadow-launcher-build-result-arm64-v2.json
          sha256sum "$result"
          cat "$result"
          if ! git ls-files --error-unmatch -- "$result" >/dev/null 2>&1; then
            echo "launcher-v2 candidate was generated, but no tracked build result exists" >&2
            exit 1
          fi

  self-test:
    name: self-test
    needs: [native-shadow-containment-linux, native-shadow-rootfs-replay-linux, native-shadow-rootfs-replay-linux-arm64, native-shadow-launcher-build-arm64, native-shadow-launcher-build-arm64-v2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # P0.3 — declare the single-threaded determinism contract at the CI level,
    # not only inside scripts/self-test.sh. RUST_TEST_THREADS=1 keeps the gate's
    # ordering deterministic (shared temp dirs, port binds, ledger paths) so a
    # CI runner cannot reorder tests into a flake the local gate never sees. The
    # master plan P0.3 contract requires this in BOTH the script and the
    # workflow file.
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Require native-shadow containment capability
        env:
          NATIVE_SHADOW_CONTAINMENT_RESULT: ${{ needs.native-shadow-containment-linux.result }}
          NATIVE_SHADOW_ROOTFS_REPLAY_RESULT: ${{ needs.native-shadow-rootfs-replay-linux.result }}
          NATIVE_SHADOW_ARM64_ROOTFS_REPLAY_RESULT: ${{ needs.native-shadow-rootfs-replay-linux-arm64.result }}
          NATIVE_SHADOW_ARM64_LAUNCHER_BUILD_RESULT: ${{ needs.native-shadow-launcher-build-arm64.result }}
          NATIVE_SHADOW_ARM64_LAUNCHER_V2_BUILD_RESULT: ${{ needs.native-shadow-launcher-build-arm64-v2.result }}
        run: |
          set -euo pipefail
          if [[ "$NATIVE_SHADOW_CONTAINMENT_RESULT" != success ]]; then
            echo "native-shadow containment capability probe did not pass" >&2
            exit 1
          fi
          if [[ "$NATIVE_SHADOW_ROOTFS_REPLAY_RESULT" != success ]]; then
            echo "native-shadow portable rootfs replay did not pass" >&2
            exit 1
          fi
          if [[ "$NATIVE_SHADOW_ARM64_ROOTFS_REPLAY_RESULT" != success ]]; then
            echo "native-shadow arm64 portable rootfs replay did not pass" >&2
            exit 1
          fi
          if [[ "$NATIVE_SHADOW_ARM64_LAUNCHER_BUILD_RESULT" != success ]]; then
            echo "native-shadow arm64 launcher double build did not pass" >&2
            exit 1
          fi
          if [[ "$NATIVE_SHADOW_ARM64_LAUNCHER_V2_BUILD_RESULT" != success ]]; then
            echo "native-shadow arm64 launcher v2 double build did not pass" >&2
            exit 1
          fi

      - name: Checkout
        # N0-pre.2 (audit) — pin to an immutable commit SHA (was the
        # mutable @v6 tag). SHA = actions/checkout v6.0.3 release commit,
        # verified via `git ls-remote https://github.com/actions/checkout
        # refs/tags/v6` on 2026-06-13; bump deliberately.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        # P0.7 (audit) — pin the third-party action to an immutable commit SHA
        # (was @master): a mutable ref is arbitrary-code-execution-on-push.
        # SHA = dtolnay/rust-toolchain master @ 2026-06; bump deliberately.
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install native checker Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # The tracked native checker is a separately versioned authority.
          # Its frozen compiler is a rust-lang CI per-commit build, not a date
          # nightly. The installer verifies all three archive hashes first.
          native_toolchain="$RUNNER_TEMP/boole-native-toolchain"
          ./scripts/install-native-checker-toolchain.sh "$native_toolchain"
          echo "BOOLE_NATIVE_TOOLCHAIN_BIN=$native_toolchain/bin" >> "$GITHUB_ENV"

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          # P0.7 (audit) — fetch the elan installer from an immutable release
          # tag (was `master`, a mutable branch tip).
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.3/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.29.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          # P0.7 (audit) — verify the published SHA-256 before trusting the
          # binary (mirrors the cargo-deny download in the supply-chain job).
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run Boole self-test
        run: ./scripts/self-test.sh

      # P0.7 (audit) — the self-test gate only builds the dev profile, so the
      # release profile (panic = "abort", opt-level, overflow checks elided)
      # ships entirely unexercised. Build the shipped binaries in release here
      # so a release-only miscompile or panic-strategy regression fails CI,
      # not production.
      - name: Build release binaries
        run: >-
          cargo build --release --locked
          -p boole-node -p boole-cli -p boole-miner
          -p boole-mcp -p boole-wallet-agent

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # N0-pre.2 (audit) — pin to an immutable commit SHA (was the
        # mutable @v6 tag). SHA = actions/checkout v6.0.3 release commit,
        # verified via `git ls-remote https://github.com/actions/checkout
        # refs/tags/v6` on 2026-06-13; bump deliberately.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        # P0.7 (audit) — pin the third-party action to an immutable commit SHA
        # (was @master): a mutable ref is arbitrary-code-execution-on-push.
        # SHA = dtolnay/rust-toolchain master @ 2026-06; bump deliberately.
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95.0

      - name: Install cargo-deny
        shell: bash
        # Bumped from 0.16.4 -> 0.19.7: 0.16.x cannot parse RustSec advisory
        # entries that use the CVSS 4.0 vector format, which the advisory-db
        # adopted in 2026. 0.17+ pulls in `rustsec` crate >= 0.30 that knows
        # CVSS 4.0; 0.19.7 is the current upstream release.
        env:
          CARGO_DENY_VERSION: "0.19.7"
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}"
          curl -sSfL "${base}/${asset}" -o /tmp/cargo-deny.tar.gz
          curl -sSfL "${base}/${asset}.sha256" -o /tmp/cargo-deny.tar.gz.sha256
          # Upstream .sha256 contains just the hex digest (no filename), so
          # rewrite it into the GNU coreutils-friendly "<digest>  <file>"
          # form before handing it to sha256sum -c.
          digest=$(awk '{print $1}' /tmp/cargo-deny.tar.gz.sha256)
          printf '%s  %s\n' "${digest}" /tmp/cargo-deny.tar.gz > /tmp/cargo-deny.tar.gz.sha256.check
          sha256sum -c /tmp/cargo-deny.tar.gz.sha256.check
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: Install cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-audit

      - name: cargo deny check
        run: cargo deny --all-features check advisories bans licenses sources

      - name: cargo audit
        run: cargo audit --deny warnings
