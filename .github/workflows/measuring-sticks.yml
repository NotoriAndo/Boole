name: measuring-sticks-metadata

on:
  push:
    branches: [main]
    paths:
      - scripts/zk_registry/data/sticks/**
      - scripts/zk_registry/measuring_sticks.py
      - scripts/zk_registry/stick_runtime.py
      - scripts/zk_registry/exec_stick_source.py
      - scripts/zk_registry/lean/InspectStickTypes.lean
      - scripts/setup_measuring_stick.sh
      - scripts/test_measuring_sticks.py
      - .github/workflows/measuring-sticks.yml
  pull_request:
    paths:
      - scripts/zk_registry/data/sticks/**
      - scripts/zk_registry/measuring_sticks.py
      - scripts/zk_registry/stick_runtime.py
      - scripts/zk_registry/exec_stick_source.py
      - scripts/zk_registry/lean/InspectStickTypes.lean
      - scripts/setup_measuring_stick.sh
      - scripts/test_measuring_sticks.py
      - .github/workflows/measuring-sticks.yml

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify schemas, frozen expectations and ordered patch digests
        run: bash scripts/setup_measuring_stick.sh --check-descriptors
      - name: Test fail-closed reconstruction without building Lean
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=scripts python3 -m unittest test_measuring_sticks
