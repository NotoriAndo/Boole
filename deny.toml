# P0.7 — cargo-deny policy for Boole supply-chain gate (L0).
#
# Required CI jobs:
#   cargo deny check advisories bans licenses sources
#   cargo audit
#
# Tightenings deferred to later P0.7 follow-ups:
#   - `multiple-versions = "deny"` once the duplicate-version drift is paid down
#   - explicit `[bans] deny = [...]` allowlist for security-sensitive crates

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# Two UPSTREAM-only `unmaintained` advisories — NOT vulnerabilities, NOT yanked —
# reachable ONLY through the sp1-verifier 6.3.1 compressed-STARK verification tree
# pulled by `boole-evm-adapter` (ADR-0018, operator msg 3518). `cargo audit`
# already passes both as allowed warnings; cargo-deny (version = 2) treats
# `unmaintained` as an error, so they are ignored HERE, narrowly by ID. No safe
# upgrade exists while sp1-verifier pins these transitively.
# Reviewed 2026-08-05 — RE-REVIEW BY 2026-11-05 (drop if a maintained release lands
# or the sp1-verifier tree stops pulling them).
ignore = [
  # ansi_term 0.12.1 — RUSTSEC-2021-0139 (unmaintained; upstream "no safe upgrade").
  # Path: boole-evm-adapter -> sp1-verifier -> sp1-recursion-machine ->
  #       sp1-hypercube -> slop-whir -> slop-jagged -> slop-basefold-prover ->
  #       slop-basefold -> slop-utils -> tracing-forest -> ansi_term.
  "RUSTSEC-2021-0139",
  # bincode 1.3.3 — RUSTSEC-2025-0141 (unmaintained). boole-evm-adapter caps proof
  # bytes BEFORE handing them to the bincode-backed deserializer (RED->GREEN test).
  # Path: boole-evm-adapter -> sp1-verifier -> sp1-recursion-machine ->
  #       sp1-hypercube -> sp1-primitives -> bincode.
  "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # webpki-roots ships under CDLA-Permissive-2.0 — a permissive data license
  # used to redistribute Mozilla's root CA bundle through rustls' TLS stack.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# wildcards in registry deps are the headline supply-chain regression P0.7
# is meant to block. Workspace-internal path deps are exempted because they
# are not a registry-supply-chain vector.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
